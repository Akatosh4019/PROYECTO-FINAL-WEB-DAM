name: Validar web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontendIndumotos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontendIndumotos/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
